name: PyWebServer_qemuj CI/CD & Jekyll Build Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  # Erlaubt manuelles Auslösen via Webhook (z.B. von n8n oder Flask /api/build)
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Ruby & Jekyll Environment
      uses: actions/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask gunicorn pytest jsonschema
        gem install jekyll bundler

    - name: Run Jekyll Static Build
      run: |
        if [ -f Gemfile ]; then bundle install && bundle exec jekyll build; else jekyll build; fi

    - name: Validate Flask App & Jinja2 Templates
      run: |
        python -c "import app; print('Flask App Syntax Validated!')"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build & Test Container Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ghcr.io/${{ github.repository_owner }}/pywebserver_qemuj:latest
