name: CI/CD Pipeline & Jekyll Deploy

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Berechtigungen für GitHub Pages Deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. Python Backend & Syntax Validation Job
  python-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy bleak flask

      - name: Validate Flask App Syntax
        run: |
          python -c "import app; print('Flask App Syntax Validated!')"

  # 2. Jekyll Static Site Build & Deploy Job
  jekyll-build-deploy:
    needs: python-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build Jekyll Site
        uses: actions/jekyll-build-pages@v1
        with:
          source: './'
          destination: './_site'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
